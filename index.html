<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Travel-Card</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="card-holder">
        <div class="card">
          <div class="card-hero">
            <div class="card-hero-top">
              <span class="badge-popular">Popular</span>
              <div class="favourite-icon-wrapper">
                <img src="./images/heart.png" />
              </div>
            </div>
            <div class="card-hero-bottom">
              <div class="card-title-group">
                <h3 class="card-title">Vereda do Pico do Arieiro</h3>
                <div class="card-location">
                  <img src="./images/Union.png" />
                  <p>Santana, Portugal</p>
                </div>
              </div>
              <div class="btn-start-route">
                <span>Start Route</span>
                <img src="./images/sendRight.png" />
              </div>
            </div>
          </div>
          <div class="card-details">
            <div class="card-stats">
              <div class="stat-item-wrapper">
                <div class="stat-item">
                  <h3>12.4 km</h3>
                  <p>distance</p>
                </div>
                <div class="stat-item">
                  <h3>840 m</h3>
                  <p>elevation</p>
                </div>
                <div class="stat-item">
                  <h3>8h 15 m</h3>
                  <p>duration</p>
                </div>
              </div>
              <div class="progress-stat">
                <div class="bottom-text">
                  <div class="level-container">
                    <div class="progress-bar">
                      <div class="progress-fill"></div>
                    </div>
                    <p class="stat-label">hard level</p>
                  </div>
                </div>
                <div class="stat-item rating-stat">
                  <div class="rating-wrapper">
                    <h3 class="stat-value">4.2</h3>
                    <img src="./images/star.png" />
                  </div>
                </div>
                <p class="stat-label">rating</p>
              </div>
            </div>
            <div class="card-map">
              <img src="./images/map.png" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
